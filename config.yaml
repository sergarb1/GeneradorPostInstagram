# ==============================================================================
# GeneradorPostInstagram 2.0 — Configuración Principal
# Diseñado para creadores y agentes de IA (Antigravity, OpenCode, Freebuff)
# ==============================================================================

# ── Contenido Editorial (Anti-IA Slop: directo, específico y honesto) ──
title: "Mejora tu Docencia"
tagline: "Estrategias y herramientas abiertas para transformar el aula"
category: "EDUCACIÓN ABIERTA" # Badge superior
body: "Plataforma comunitaria de recursos pedagógicos prácticos y verificados por docentes en activo, sin suscripciones ni publicidad."

# ── Puntos Clave / Características (hasta 4) ──
features:
  - icon: "🎯"
    title: "100% Libre y Gratuito"
    desc: "Sin barreras de registro, muros de pago ni rastreo"
  - icon: "🤝"
    title: "Construcción Colectiva"
    desc: "Materiales probados en secundaria, FP y universidad"
  - icon: "⚡"
    title: "Implementación Rápida"
    desc: "Guías directas de 5 minutos listas para aplicar"
  - icon: "🌱"
    title: "Código y Contenido Abierto"
    desc: "Licenciado bajo Creative Commons y AGPL"

# ── Llamada a la Acción (CTA) y Metadatos ──
cta_text: "mejoratudocencia.es"
cta_url: "https://mejoratudocencia.es"
hashtags: "#Docencia #EducaciónLibre #RecursosDocentes #InnovacionEducativa"

# ── Configuración Visual y Layout ──
layout: "card"        # card | diagram | minimal | split | quote
aspect: "1:1"         # 1:1 (cuadrado 1080x1080) | 4:5 (feed portrait 1080x1350) | 9:16 (story 1080x1920)

# ── Banco de Imágenes Libres (Openverse / Wikimedia) ──
# Descomenta para buscar y aplicar automáticamente una foto de fondo libre de derechos:
# stock:
#   query: "classroom innovation books minimal"
#   overlay: "dark"    # dark (scrim de contraste) | light | vignette | none
#   blur: 0            # desenfoque gaussiano (0 a 10)

# ── Diagrama de Excalidraw (SVG o PNG) ──
# Si usas layout: "diagram" o layout: "split":
# diagram: "custom/diagram.svg"

# ── Identidad de Marca y Logo ──
logo:
  path: null           # Ej: "custom/logo.svg" o "custom/logo.png"
  position: "top-right"# top-right | top-left | bottom-right | bottom-left | center-top
  height: 55           # Alto en píxeles (ancho automático proporcional)
  badge: false         # true para colocar una pastilla de cristal esmerilado detrás
  extract_palette: false # true para derivar los colores del post directamente del logo

# ── Paleta Cromática ──
colors:
  primary: "#16a34a"         # Color corporativo / acento principal
  primary_dark: "#14532d"    # Tono oscuro para titulares y botones
  gradient_top: "#15803d"    # Superior del degradado
  gradient_bottom: "#052e16" # Base profunda del degradado
  card_bg: "#ffffffeb"       # Fondo de tarjeta (hex con transparencia)
  text_body: "#334155"       # Texto del cuerpo legible
  text_light: "#64748b"      # Subtítulos y descripciones
  accent_light: "#bbf7d0"    # Acento claro para badges y píldoras

# ── Tipografías ──
fonts:
  title: "Outfit-Bold.ttf"
  tagline: "Outfit-Regular.ttf"
  body: "Outfit-Regular.ttf"
  bold: "Outfit-Bold.ttf"

# ── Imagen de fondo manual (opcional, sobreescribe el gradiente) ──
background: null

# ── Destino de Salida ──
output: "output/post.png"
